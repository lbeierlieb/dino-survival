<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fire Water Storm Lightning</title>
  <style>
    html, body { margin: 0; height: 100%; background: #16141a; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center;
               color: #ddd; font: 24px sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">Loading dinosaurs…</div>
  <canvas id="bevy" tabindex="0"></canvas>
  <script type="module">
    import init from './dino-survival.js';
    const canvas = document.getElementById('bevy');
    canvas.focus();
    canvas.addEventListener('click', () => canvas.focus());
    init()
      .catch((e) => {
        // winit uses an exception to hand control to the browser event loop.
        if (!String(e).includes('Using exceptions for control flow')) throw e;
      })
      .finally(() => document.getElementById('loading').remove());
  </script>
</body>
</html>
